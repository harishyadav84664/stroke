<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIDUS · Register</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: rail(${active})}"></aside>
  <main class="workspace">
    <header class="page-head">
      <div>
        <p class="kicker">New acquisition</p>
        <h1>Register a study</h1>
      </div>
    </header>
    <p class="banner">Use synthetic identifiers. This form registers a case to the worklist database. It does not upload a DICOM file.</p>

    <form class="sheet" method="post" th:action="@{/studies}" th:object="${form}">
      <div class="fields">
        <label>
          Accession
          <input type="text" th:field="*{accession}" maxlength="16" placeholder="NID-24050" required>
          <small th:if="${#fields.hasErrors('accession')}" th:errors="*{accession}">Error</small>
        </label>
        <label>
          Patient code
          <input type="text" th:field="*{patientCode}" maxlength="16" placeholder="P-2301" required>
          <small th:if="${#fields.hasErrors('patientCode')}" th:errors="*{patientCode}">Error</small>
        </label>
        <label>
          Age
          <input type="number" th:field="*{age}" min="18" max="110" required>
          <small th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Error</small>
        </label>
        <label>
          Sex
          <select th:field="*{sex}">
            <option value="">Select</option>
            <option th:each="item : ${sexes}" th:value="${item}" th:text="${item.label}"></option>
          </select>
          <small th:if="${#fields.hasErrors('sex')}" th:errors="*{sex}">Error</small>
        </label>
        <label>
          Modality
          <select th:field="*{modality}">
            <option value="">Select</option>
            <option th:each="item : ${modalities}" th:value="${item}" th:text="${item.label}"></option>
          </select>
          <small th:if="${#fields.hasErrors('modality')}" th:errors="*{modality}">Error</small>
        </label>
        <label>
          Sequence
          <input type="text" th:field="*{sequenceName}" maxlength="24" placeholder="DWI" required>
          <small th:if="${#fields.hasErrors('sequenceName')}" th:errors="*{sequenceName}">Error</small>
        </label>
        <label>
          Hours from onset
          <input type="number" th:field="*{onsetHours}" min="0" max="72" step="0.1" required>
          <small th:if="${#fields.hasErrors('onsetHours')}" th:errors="*{onsetHours}">Error</small>
        </label>
        <label>
          NIHSS
          <input type="number" th:field="*{nihss}" min="0" max="42" required>
          <small th:if="${#fields.hasErrors('nihss')}" th:errors="*{nihss}">Error</small>
        </label>
        <label>
          Territory, if known
          <input type="text" th:field="*{territory}" maxlength="80" placeholder="Left MCA">
          <small th:if="${#fields.hasErrors('territory')}" th:errors="*{territory}">Error</small>
        </label>
        <label>
          ASPECTS, if known
          <input type="number" th:field="*{aspects}" min="0" max="10">
          <small th:if="${#fields.hasErrors('aspects')}" th:errors="*{aspects}">Error</small>
        </label>
        <label class="span-2">
          Reader note
          <textarea th:field="*{findings}" maxlength="1000" rows="4" placeholder="What the reader should see on this demonstration case"></textarea>
          <small th:if="${#fields.hasErrors('findings')}" th:errors="*{findings}">Error</small>
        </label>
      </div>
      <div class="actions">
        <button type="submit">Save study</button>
        <a class="text-link" th:href="@{/studies}">Cancel</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
