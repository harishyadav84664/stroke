spring.application.name=nidus
server.port=8080

# Default profile: h2 enables immediate zero-configuration execution.
# To run with MySQL: pass --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.default=h2

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.thymeleaf.cache=false

spring.config.import=optional:file:./application-local.properties
